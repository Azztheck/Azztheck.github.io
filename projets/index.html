<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mes projets</title>
<style>
:root{--bg:#f6f5f2;--card:#fff;--ink:#1d1c1a;--mute:#6d6a64;--line:#e4e1db;--acc:#2f6fdb;--ok:#1f8a4c;--warn:#b7791f;--bad:#c0392b;--bar:#2f6fdb}
@media (prefers-color-scheme:dark){:root{--bg:#141517;--card:#1c1e21;--ink:#ecebe8;--mute:#9a978f;--line:#2c2f33;--acc:#6ea0ff;--ok:#4cc27e;--warn:#e0a84a;--bad:#ef6b5b;--bar:#6ea0ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,"Segoe UI",sans-serif}
header{padding:20px 16px 8px;max-width:1200px;margin:auto;display:flex;flex-wrap:wrap;gap:12px;align-items:end;justify-content:space-between}
h1{font-size:22px;margin:0}
.sub{color:var(--mute);font-size:12px}
.tools{display:flex;gap:8px;flex-wrap:wrap}
input,select,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
button:hover{border-color:var(--acc)}
main{max-width:1200px;margin:auto;padding:8px 16px 40px}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--mute);font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
th.on{color:var(--acc)}
tr:last-child td{border-bottom:0}
.nom{font-weight:600}
.res{color:var(--mute);font-size:12px;max-width:380px}
.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;margin:1px 0}
.run{color:var(--ok);border-color:var(--ok)}
.plan{color:var(--acc);border-color:var(--acc)}
.err{color:var(--bad);border-color:var(--bad)}
.man{color:var(--mute)}
.etat{color:var(--warn);border-color:var(--warn)}
.spark{display:flex;gap:2px;align-items:end;height:22px}
.spark i{display:block;width:5px;background:var(--bar);border-radius:1px;min-height:1px;opacity:.85}
.spark i.z{background:var(--line)}
.act{display:flex;gap:6px;justify-content:flex-end}
.act a,.act button{padding:4px 9px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.when{white-space:nowrap}
.liens{margin-top:4px;display:flex;flex-wrap:wrap;gap:4px}
.liens a{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--acc);color:var(--acc);text-decoration:none}
.liens a:hover{background:var(--acc);color:#fff}
.when small{display:block;color:var(--mute);font-size:11px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);max-width:720px;width:calc(100% - 32px);padding:0}
dialog::backdrop{background:#0008}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.db{padding:6px 18px 18px;max-height:70vh;overflow:auto}
.db h3{font-size:13px;margin:16px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
.db ul{margin:0;padding-left:20px}
li.ok::marker{content:"✔  ";color:var(--ok)}
li.todo::marker{content:"○  ";color:var(--warn)}
pre{white-space:pre-wrap;font:12px/1.5 ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;max-height:300px;overflow:auto}
tr.arch{opacity:.6}
.ed label{display:block;margin:12px 0 4px;font-size:12px;color:var(--mute)}
.ed input,.ed textarea{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
.ed .bt{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.prim{background:var(--acc);color:#fff;border-color:var(--acc)}
code{font:12px ui-monospace,Consolas,monospace;word-break:break-all}
@media (max-width:760px){
  table,tbody,tr,td{display:block;border:0}
  thead{display:none}
  tr{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px 0}
  table{background:none;border:0}
  td{padding:4px 14px}
  td.num{text-align:left}
  td[data-l]::before{content:attr(data-l)" : ";color:var(--mute);font-size:12px}
  .act{justify-content:flex-start}
}
</style>
</head>

</table>
</main>

const taille=b=>b<1024?b+" o":b<1048576?(b/1024).toFixed(0)+" Ko":b<1073741824?(b/1048576).toFixed(1)+" Mo":(b/1073741824).toFixed(2)+" Go";
const fdate=t=>new Date(t).toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit",hour:"2-digit",minute:"2-digit"});
function depuis(ms){const s=(DATA.genere*1000-ms)/1000;if(s<3600)return"il y a "+Math.max(1,Math.round(s/60))+" min";if(s<86400)return"il y a "+Math.round(s/3600)+" h";const j=Math.round(s/86400);if(j<60)return"il y a "+j+" j";return"il y a "+Math.round(j/30)+" mois"}
P.forEach(p=>{
  p.activite=p.hebdo.reduce((a,b)=>a+b,0);
  p.err=p.taches.some(t=>t.derniere&&t.resultat&&t.resultat!==267009&&t.resultat!==267011&&t.resultat!==0);
  p.mode=p.process.length?"run":p.taches.length?"plan":"man";
  p.exec=p.process.length*1000+p.taches.length;
});
document.getElementById("gen").textContent="Mis à jour le "+fdate(DATA.genere*1000)+" · "+P.length+" projets"+(DATA.public?"":" · F5 pour rafraîchir")+(P.some(p=>p.archive)?" · "+P.filter(p=>p.archive).length+" archivé(s)":"");
let tri={k:"modif",dir:-1};
function execCell(p){
  let h="";
  if(p.process.length)h+=`<span class="badge run">▶ tourne en ce moment</span> `;
  p.taches.forEach(t=>{h+=`<span class="badge ${p.err?"err":"plan"}" title="${esc(t.nom)} — ${esc(t.frequence)}">⏱ ${esc(t.frequence)}</span> `});
  if(p.err)h+=`<span class="badge err">dernier lancement en erreur</span>`;
  return h||`<span class="badge man">manuel</span>`;
}
const liens=p=>p.liens.length?`<div class="liens">${p.liens.map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">🔗 ${esc(l.titre)}</a>`).join("")}</div>`:"";
function spark(h){const m=Math.max(1,...h);return`<div class="spark" title="fichiers modifiés par semaine (12 dernières)">${h.map(v=>`<i class="${v?"":"z"}" style="height:${v?Math.max(3,22*v/m):1}px"></i>`).join("")}</div>`}
function rendre(){
  const q=document.getElementById("q").value.toLowerCase(),f=document.getElementById("f").value;
  const L=P.filter(p=>(f==="arch"?p.archive:!p.archive)&&(!f||f==="arch"||p.mode===f)&&(!q||(p.nom+" "+p.resume+" "+p.chemin).toLowerCase().includes(q)))
   .sort((a,b)=>{const x=a[tri.k],y=b[tri.k];return(typeof x==="string"?x.localeCompare(y):x-y)*tri.dir});
  document.querySelectorAll("th").forEach(th=>th.classList.toggle("on",th.dataset.k===tri.k));
  document.getElementById("tb").innerHTML=L.map(p=>`<tr class="${p.archive?"arch":""}">
    <td><div class="nom">${esc(p.nom)} ${p.etat?`<span class="badge etat">${esc(p.etat)}</span>`:""}</div><div class="res">${esc(p.resume)}</div>${liens(p)}</td>
    <td class="when" data-l="Modifié">${p.modif?depuis(p.modif*1000)+`<small>${fdate(p.modif*1000)}</small>`:"—"}</td>
    <td data-l="Exécution">${execCell(p)}</td>
    <td data-l="Activité">${spark(p.hebdo)}</td>
    <td class="num" data-l="Poids">${taille(p.poids)}${p.poids_hors_env<p.poids*0.8?`<small style="display:block;color:var(--mute);font-size:11px">${taille(p.poids_hors_env)} hors venv</small>`:""}</td>
    <td><div class="act"><button onclick="info(${P.indexOf(p)})">ℹ Infos</button>${DATA.public?"":`<button onclick="editer(${P.indexOf(p)})" title="Renommer / modifier la description">✎</button><button onclick="archiver(${P.indexOf(p)})" title="${p.archive?"Désarchiver":"Archiver"}">${p.archive?"↩":"🗄"}</button><a href="file:///${encodeURI(p.chemin.replace(/\\/g,"/"))}" target="_blank" title="Ouvrir le dossier">📂</a>`}</div></td>
  </tr>`).join("");
}
function info(i){
  const p=P[i];
  document.getElementById("dt").textContent=p.nom;
  document.getElementById("ds").textContent=p.resume;
  let h=p.liens.length?`<h3>Liens</h3>${liens(p)}`:"";
  if(p.fait.length||p.a_faire.length){
    h+=`<h3>Avancement${p.etat?" — "+esc(p.etat):""}</h3><ul>${p.fait.map(x=>`<li class="ok">${esc(x)}</li>`).join("")}${p.a_faire.map(x=>`<li class="todo">${esc(x)}</li>`).join("")}</ul>`;
  } else if(!p.fiche) h+=`<h3>Avancement</h3><p class="res">Pas encore de fiche — ajoute-la dans <code>tableau-projets\\projets.json</code> (ou demande-moi).</p>`;
  if(p.taches.length){h+=`<h3>Tâches planifiées</h3><ul>${p.taches.map(t=>`<li><b>${esc(t.nom)}</b> (${esc(t.etat)}) — ${esc(t.frequence)}<br><span class="res">dernier lancement : ${t.derniere?fdate(t.derniere):"jamais"}${t.prochaine?" · prochain : "+fdate(t.prochaine):""}${t.resultat?" · code "+t.resultat:""}</span></li>`).join("")}</ul>`}
  if(p.process.length)h+=`<h3>En cours</h3><ul>${p.process.map(x=>`<li>${esc(x.nom)} (PID ${x.pid})</li>`).join("")}</ul>`;
  h+=`<h3>Fichiers</h3><p class="res">${p.fichiers} fichiers · ${taille(p.poids)} (${taille(p.poids_hors_env)} hors venv/.git)<br>Dernier modifié : <code>${esc(p.modif_fichier)}</code><br>Dossier : <code>${esc(p.chemin)}</code></p>`;
  if(p.note)h+=`<h3>Extrait de ${esc(p.note_nom)}</h3><pre>${esc(p.note)}${p.note.length>=2500?"\n…":""}</pre>`;
  document.getElementById("dbody").innerHTML=h;
  document.getElementById("dlg").showModal();
}
async function api(p,champs){
  if(location.protocol==="file:"){alert("Ouvre le tableau avec le raccourci « Mes projets » du Bureau pour pouvoir modifier.");return}
  const r=await fetch("/api/fiche",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chemin:p.chemin,champs})});
  if(!r.ok){alert("Erreur : "+(await r.text()));return}
  Object.assign(p,champs);p.archive=!!p.archive;dlg.open&&dlg.close();rendre();
}
function archiver(i){const p=P[i];api(p,{archive:!p.archive})}
function editer(i){
  const p=P[i];
  document.getElementById("dt").textContent="Modifier";
  document.getElementById("ds").textContent=p.chemin;
  document.getElementById("dbody").innerHTML=`<form class="ed" onsubmit="event.preventDefault();api(P[${i}],{nom:this.n.value.trim(),resume:this.r.value.trim()})">
    <label>Nom affiché</label><input name="n" value="${esc(p.nom)}" required>
    <label>Description rapide</label><textarea name="r" rows="3">${esc(p.resume)}</textarea>
    <div class="bt"><button type="button" onclick="dlg.close()">Annuler</button><button class="prim">Enregistrer</button></div></form>`;
  dlg.showModal();document.querySelector(".ed input").select();
}
document.querySelectorAll("th[data-k]").forEach(th=>th.onclick=()=>{const k=th.dataset.k;tri=tri.k===k?{k,dir:-tri.dir}:{k,dir:k==="nom"?1:-1};rendre()});
document.getElementById("q").oninput=rendre;document.getElementById("f").onchange=rendre;
rendre();
</script>
</body>
</html>
