<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visite 3D</title>
<style>
  :root { --police: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
          --verre: rgba(28, 28, 30, .5); --flou: saturate(180%) blur(20px); }
  html, body { margin: 0; height: 100%; background: #000; color: #f5f5f7; font: 13px/1.3 var(--police); overflow: hidden; -webkit-font-smoothing: antialiased; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
  #load[hidden] { display: none; }
  #load div { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: var(--verre);
              -webkit-backdrop-filter: var(--flou); backdrop-filter: var(--flou); font-weight: 500; letter-spacing: -.01em; }
  #load div::before { content: ""; width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25);
                      border-top-color: #fff; animation: tourne .8s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }
  #aide { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%);
          padding: 8px 16px; border-radius: 999px; background: var(--verre); border: .5px solid rgba(255,255,255,.18);
          -webkit-backdrop-filter: var(--flou); backdrop-filter: var(--flou); font-weight: 500; letter-spacing: -.01em;
          white-space: nowrap; max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis; transition: opacity .8s; }
  #aide.cache { opacity: 0; }
  #pos { position: fixed; top: 12px; left: 12px; font: 12px ui-monospace, monospace; background: var(--verre); padding: 6px 10px; border-radius: 8px; }
  /* Flèches d'orientation : ▲▼ lever / baisser la vue, ↺↻ pencher à gauche / à droite */
  #fleches { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: max(72px, calc(env(safe-area-inset-bottom) + 56px));
             display: grid; grid-template: repeat(3, 48px) / repeat(3, 48px); gap: 4px; }
  #fleches[hidden] { display: none; }
  #fleches button { width: 48px; height: 48px; border-radius: 50%; border: .5px solid rgba(255,255,255,.18); background: var(--verre);
                    -webkit-backdrop-filter: var(--flou); backdrop-filter: var(--flou); color: #f5f5f7; font: 20px/1 var(--police);
                    cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #fleches button:active { background: rgba(255,255,255,.28); }
  #fleches [data-p="1"] { grid-area: 1 / 2; }  #fleches [data-p="-1"] { grid-area: 3 / 2; }
  #fleches [data-r="1"] { grid-area: 2 / 1; }  #fleches [data-r="-1"] { grid-area: 2 / 3; }
</style>
<script type="importmap">
  { "imports": {
      "three": "./lib/three/three.module.js",
      "three/addons/": "./lib/three/addons/",
      "@sparkjsdev/spark": "./lib/spark.module.js" } }
</script>
</head>
<body>
<div id="load"><div>Chargement <span id="pct"></span></div></div>
<div id="aide"></div>
<div id="pos" hidden></div>
<div id="fleches">
  <button data-p="1" aria-label="Lever la vue">▲</button>
  <button data-r="1" aria-label="Pencher à gauche">↺</button>
  <button data-r="-1" aria-label="Pencher à droite">↻</button>
  <button data-p="-1" aria-label="Baisser la vue">▼</button>
</div>
<script type="module">
// Paramètres d'URL :
//   src=chemin/vers/scene.ply|.spz|.sog|.splat   (obligatoire)
//   rot=rx,ry,rz                                   (redresser le modèle, en degrés)
//   cam=x,y,z & look=x,y,z                         (point de vue de départ, sinon centre du modèle)
//   edit                                           (affiche la position caméra pour régler cam/look)
import * as THREE from "three";
import { SparkRenderer, SplatMesh, SparkControls } from "@sparkjsdev/spark";

const q = new URLSearchParams(location.search);
const vec = s => s && new THREE.Vector3(...s.split(",").map(Number));
const tactile = matchMedia("(pointer: coarse)").matches;
document.getElementById("aide").textContent = tactile
  ? "Glisser pour regarder · deux doigts pour se déplacer"
  : "Glisser pour regarder · Z Q S D ou flèches pour se déplacer · molette pour avancer";

const renderer = new THREE.WebGLRenderer({ antialias: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(+(q.get("fov") || 75), 1, 0.01, 500);
// Réglages validés contre le rendu de Brush (voir visites360/compare_splat.py) ; surcharge possible via ?spark={...}
const reglages = { sortRadial: false, maxPixelRadius: 2048, clipXY: 2.0, ...JSON.parse(q.get("spark") || "{}") };
scene.add(new SparkRenderer({ renderer, ...reglages }));

const resize = () => {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
};
addEventListener("resize", resize); resize();

const splat = new SplatMesh({
  url: q.get("src"),
  onProgress: e => { if (e.total) document.getElementById("pct").textContent = Math.round(100 * e.loaded / e.total) + " %"; },
});
splat.quaternion.set(1, 0, 0, 0);   // repère COLMAP (Y vers le bas) -> repère three.js
if (q.get("rot")) {
  const [rx, ry, rz] = q.get("rot").split(",").map(d => THREE.MathUtils.degToRad(+d));
  splat.quaternion.premultiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(rx, ry, rz)));
}
scene.add(splat);

splat.initialized.then(() => {
  document.getElementById("load").hidden = true;
  const box = splat.getBoundingBox(true).applyMatrix4(splat.matrixWorld);
  const centre = box.getCenter(new THREE.Vector3());
  camera.position.copy(vec(q.get("cam")) || centre);
  const look = vec(q.get("look")) || centre.clone().add(new THREE.Vector3(0, 0, -1));
  if (q.get("up")) camera.up.copy(vec(q.get("up")));
  camera.lookAt(look);
  window.pret = true;
  setTimeout(() => document.getElementById("aide").classList.add("cache"), 6000);
}).catch(err => {
  document.querySelector("#load div").textContent = "Impossible de charger le modèle 3D (" + err.message + ")";
});

const controls = new SparkControls({ canvas: renderer.domElement });
controls.fpsMovement.moveSpeed = 1.2;            // m/s : allure de visite, pas de jeu vidéo
const pos = document.getElementById("pos");
pos.hidden = !q.has("edit");

// Flèches : tant qu'un bouton est appuyé, la vue tourne (tangage ▲▼, roulis ↺↻). Cachées pour les captures automatiques.
const fleches = document.getElementById("fleches");
fleches.hidden = navigator.webdriver;
const VITESSE = THREE.MathUtils.degToRad(50);   // degrés par seconde
const actif = { p: 0, r: 0 };
for (const b of fleches.querySelectorAll("button")) {
  const axe = "p" in b.dataset ? "p" : "r", sens = +b.dataset[axe];
  b.addEventListener("pointerdown", e => { e.preventDefault(); b.setPointerCapture(e.pointerId); actif[axe] = sens; });
  for (const fin of ["pointerup", "pointercancel", "lostpointercapture"]) b.addEventListener(fin, () => { if (actif[axe] === sens) actif[axe] = 0; });
  b.addEventListener("contextmenu", e => e.preventDefault());
}
let avant = performance.now();
window.camera = camera;   // pour les tests automatiques

renderer.setAnimationLoop(() => {
  const maintenant = performance.now(), dt = Math.min(0.1, (maintenant - avant) / 1000);
  avant = maintenant;
  controls.update(camera);
  if (actif.p || actif.r) {
    const e = new THREE.Euler().setFromQuaternion(camera.quaternion, "YXZ");   // même convention que SparkControls
    e.x = THREE.MathUtils.clamp(e.x + actif.p * VITESSE * dt, -Math.PI / 2, Math.PI / 2);
    e.z = THREE.MathUtils.clamp(e.z + actif.r * VITESSE * dt, -Math.PI, Math.PI);
    camera.quaternion.setFromEuler(e);
  }
  if (!pos.hidden) {
    const d = camera.getWorldDirection(new THREE.Vector3()).add(camera.position);
    const f = v => v.toArray().map(n => n.toFixed(2)).join(",");
    pos.textContent = `cam=${f(camera.position)}&look=${f(d)}`;
  }
  renderer.render(scene, camera);
});
</script>
</body>
</html>
